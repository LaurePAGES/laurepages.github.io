- question: Quelle différence avec un syndic ?
  reponse: "Le syndic gère l'immeuble au quotidien et exécute les décisions de l'assemblée générale. Je ne gère pas votre copropriété : je vous aide à comprendre et à contrôler cette gestion, avec un regard extérieur."
- question: Vous êtes comptable dans un cabinet de syndic. Est-ce compatible ?
  reponse: "Oui, et c'est ce qui me permet de connaître les comptes de copropriété au quotidien. Je n'interviens jamais sur une copropriété gérée par le cabinet qui m'emploie, ni sur un dossier qui pourrait le concerner. Je vérifie ce point avec vous dès le premier échange."
- question: "Qui fait appel à vous : le conseil syndical ou un copropriétaire ?"
  reponse: "Les deux. Le plus souvent, c'est le conseil syndical. Un copropriétaire peut aussi me consulter seul pour comprendre ses charges ou préparer une assemblée générale."
- question: Qui paie la mission ?
  reponse: "Quand c'est le conseil syndical qui me sollicite pour sa mission, les dépenses nécessaires sont des dépenses courantes d'administration supportées par le syndicat (article 27 du décret du 17 mars 1967). Un copropriétaire qui me consulte à titre personnel règle lui-même la prestation."
- question: Est-ce que vous intervenez en dehors de la Haute-Garonne ?
  reponse: "Oui, à distance (visio, téléphone, échanges de documents). Les déplacements hors Haute-Garonne sont possibles sur devis."
- question: Êtes-vous avocate ou expert-comptable ?
  reponse: "Non. J'apporte une expérience de terrain des comptes et de la gestion de copropriété. Je ne certifie pas les comptes : je les analyse et je vous les explique. En cas de litige ou de question juridique précise, je vous oriente vers un professionnel du droit."
- question: Que deviennent nos documents ?
  reponse: "Ils sont utilisés uniquement pour votre mission, ne sont jamais transmis à des tiers et sont supprimés à la fin de la mission, sauf demande contraire de votre part."
- question: Combien de temps prend un audit ?
  reponse: "En général 2 à 3 semaines après réception de l'ensemble des documents. Le délai est fixé dans le devis, en tenant compte de la date de votre assemblée générale."
